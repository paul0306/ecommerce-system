spring:
  datasource:
    url: jdbc:h2:file:./data/ecommerce;MODE=MySQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      schema-locations:
        - classpath:schema.sql
        - classpath:stored-procedures.sql
      data-locations:
        - classpath:data.sql

server:
  port: 8080

